[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "solar-sites"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn>=0.41,<1", "pydantic[email]>=2.12,<3",
  "pydantic-settings>=2.13,<3", "sqlalchemy[asyncio]>=2.0,<3", "aiosqlite>=0.22,<1",
  "alembic>=1.18,<2", "httpx>=0.28,<1", "pwdlib[argon2]>=0.3,<1",
]

[project.scripts]
solar-sites-openapi = "solar_sites.openapi:main"

[dependency-groups]
dev = ["ruff>=0.15,<1", "mypy>=1.19,<2", "pyright>=1.1.414,<2", "pytest>=9,<10", "pytest-asyncio>=1.3,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/solar_sites"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportDeprecated = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
